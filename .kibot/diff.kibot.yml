      new: 'HEAD'
      new_type: 'git'
      diff_mode: 'red_green'
      dpi: 300
      only_different: true
    layers:
      - 'In1.Cu'

  - name: 'diff_tag_pcb_in2'
    comment: "visual PCB diff vs last hardware tag, In2.Cu layer (PDF part, see page-order note)"
    type: diff
    dir: diff/tag
    options:
      old: '@KIBOT_DIFF_TAG@'
      output: 'diff_tag-@KIBOT_DIFF_NEW_SHORT@-@KIBOT_DIFF_TAG_BASE_SHORT@-@KIBOT_DIFF_TAG@-pcb-In2_Cu.%x'
