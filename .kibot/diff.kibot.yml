  - name: 'diff_sch'
    comment: "visual schematic diff vs previous commit (red/green overlay PDF)"
    type: diff
    dir: diff/commit
    options:
      old: '@KIBOT_DIFF_OLD_SCH@'
      output: 'diff_commit-@KIBOT_DIFF_CHG_SCH_SHORT@-@KIBOT_DIFF_OLD_SCH_SHORT@-sch.%x'
      old_type: 'git'
      new: 'HEAD'
      new_type: 'git'
      diff_mode: 'red_green'
      dpi: 300
      only_different: true
      # [boolean=true] Compare the PCB, false compares the schematic.
      pcb: false

  - name: 'diff_tag_pcb_fcu'
    comment: "visual PCB diff vs last hardware tag, F.Cu layer (PDF part, see page-order note)"
    type: diff
    dir: diff/tag
    options:
      # The tag name is injected from CI via `kibot -E KIBOT_DIFF_TAG=...`
      # (resolved at runtime with `git describe`, never hardcoded).
      old: '@KIBOT_DIFF_TAG@'
      # Tag name embedded in the filename (e.g. diff_tag-v0.5-pcb-F_Cu.pdf).
      # Tag refs like v0.5 are filename-safe; KiBot also sanitizes expanded
      # names, so exotic tag characters can't break the output.
      # New SHA first, tag base commit second, tag name LAST, e.g.
      # diff_tag-0888845-cd41e62-v0.5-pcb-F_Cu.pdf. The layer suffix keeps
      # the seven parts distinct; CI merges them into diff_tag-...-pcb.pdf.
      output: 'diff_tag-@KIBOT_DIFF_NEW_SHORT@-@KIBOT_DIFF_TAG_BASE_SHORT@-@KIBOT_DIFF_TAG@-pcb-F_Cu.%x'
      old_type: 'git'
      new: 'HEAD'
      new_type: 'git'
      diff_mode: 'red_green'
      # 300 dpi like the commit pair; no persistent cache (temp dir per run).
      dpi: 300
      only_different: true
    layers:
      - 'F.Cu'

  - name: 'diff_tag_pcb_in1'
    comment: "visual PCB diff vs last hardware tag, In1.Cu layer (PDF part, see page-order note)"
    type: diff
    dir: diff/tag
    options:
      old: '@KIBOT_DIFF_TAG@'
      output: 'diff_tag-@KIBOT_DIFF_NEW_SHORT@-@KIBOT_DIFF_TAG_BASE_SHORT@-@KIBOT_DIFF_TAG@-pcb-In1_Cu.%x'
