    options:
      old: '@KIBOT_DIFF_OLD_PCB@'
      output: 'diff_commit-@KIBOT_DIFF_CHG_PCB_SHORT@-@KIBOT_DIFF_OLD_PCB_SHORT@-pcb-Edge_Cuts.%x'
      old_type: 'git'
