outputs:
  - name: 'diff_pcb'
    comment: "visual PCB diff vs previous commit (red/green overlay PDF)"
    type: diff
    dir: diff/commit
    options:
      # [string='HEAD'] Reference to compare against. A git branch/tag/hash when old_type is git.
      # The base commit is injected from CI via `kibot -E KIBOT_DIFF_OLD=...`
      # (@VAR@ is KiBot's preprocessor replacement), so this file never
      # hardcodes a branch name or assumes one.
      old: '@KIBOT_DIFF_OLD_PCB@'
      # Explicit filename: the default (%i-based) name is identical for the
      # commit and tag pairs, which would collide when flattened into the
      # release assets. The short base SHA tells the reviewer what this is
      # compared against.
      output: 'diff_commit-@KIBOT_DIFF_OLD_PCB_SHORT@_pcb.%x'
      # [git,file,output,multivar='git'] How to interpret the `old` name.
      old_type: 'git'
      # [string|list(string)=''] File to compare, blank means the current PCB/SCH.
      # 'HEAD' = the checked-out commit, equivalent to current in a clean CI tree.
      new: 'HEAD'
      # [git,file,output,multivar,current='current'] How to interpret the `new` name.
      new_type: 'git'
      # [red_green,stats,2color='red_green'] Added stuff green, removed red.
      diff_mode: 'red_green'
      # [number=72..600] Resolution (Dots Per Inch) for the diff images.
      dpi: 150
      # [boolean=false] Only include layers/pages with differences in the output PDF.
      only_different: true
    layers:
      - 'F.Cu'
      - 'B.Cu'
      - 'F.SilkS'
      - 'B.SilkS'
      - 'Edge.Cuts'

  - name: 'diff_sch'
    comment: "visual schematic diff vs previous commit (red/green overlay PDF)"
    type: diff
    dir: diff/commit
    options:
      old: '@KIBOT_DIFF_OLD_SCH@'
      output: 'diff_commit-@KIBOT_DIFF_OLD_SCH_SHORT@_sch.%x'
      old_type: 'git'
      new: 'HEAD'
      new_type: 'git'
      diff_mode: 'red_green'
      dpi: 150
      only_different: true
      # [boolean=true] Compare the PCB, false compares the schematic.
      pcb: false

  - name: 'diff_tag_pcb'
    comment: "visual PCB diff vs last hardware tag (red/green overlay PDF)"
    type: diff
    dir: diff/tag
    options:
      # The tag name is injected from CI via `kibot -E KIBOT_DIFF_TAG=...`
      # (resolved at runtime with `git describe`, never hardcoded).
      old: '@KIBOT_DIFF_TAG@'
      # Tag name embedded in the filename (e.g. diff_tag-v0.5_pcb.pdf).
      # Tag refs like v0.5 are filename-safe; KiBot also sanitizes expanded
      # names, so exotic tag characters can't break the output.
      output: 'diff_tag-@KIBOT_DIFF_TAG@_pcb.%x'
      old_type: 'git'
      new: 'HEAD'
      new_type: 'git'
      diff_mode: 'red_green'
      dpi: 150
      only_different: true
    layers:
      - 'F.Cu'
      - 'B.Cu'
      - 'F.SilkS'
      - 'B.SilkS'
      - 'Edge.Cuts'

  - name: 'diff_tag_sch'
    comment: "visual schematic diff vs last hardware tag (red/green overlay PDF)"
    type: diff
    dir: diff/tag
    options:
      old: '@KIBOT_DIFF_TAG@'
      output: 'diff_tag-@KIBOT_DIFF_TAG@_sch.%x'
      old_type: 'git'
      new: 'HEAD'
      new_type: 'git'
      diff_mode: 'red_green'
      dpi: 150
      only_different: true
      # [boolean=true] Compare the PCB, false compares the schematic.
      pcb: false
