# PCB/schematic visual diffs (red/green overlay PDFs) for the preview release.
#
# PAGE-ORDER NOTE (read before touching `layers:`): the `layers:` list does
# NOT control the PDF page order. KiBot delegates to kicad-diff
# (INTI-CMNB/KiDiff, kicad-diff.py DiffImages), which emits pages with
# `for i in sorted(all_layers)` - i.e. sorted by KiCad's INTERNAL layer ID.
# Since KiCad 9 the IDs are F.Cu=0, B.Cu=2, In1.Cu=4, F.SilkS=5, In2.Cu=6,
# B.SilkS=7, Edge.Cuts=25, so a multi-layer diff comes out as
# F, B, In1, F.Silk, In2, B.Silk, Edge no matter the list order here, and
# `only_different: true` then drops unchanged pages, so the visible order
# varies per diff. Robust fix, immune to any future ID renumbering: ONE
# single-layer diff output per layer below; CI concatenates the parts in
# stack-up order (F.Cu, In1.Cu, In2.Cu, B.Cu, F.SilkS, B.SilkS, Edge.Cuts)
# with pdfunite (see release-preview.yml "merge per-layer diffs"). An
# unchanged layer yields a 1-page "No diff" placeholder which CI drops by
# page size, so `only_different` semantics are preserved.
outputs:
  - name: 'diff_pcb_fcu'
    comment: "visual PCB diff vs previous commit, F.Cu layer (red/green overlay PDF part)"
    type: diff
    dir: diff/commit
    options:
      # [string='HEAD'] Reference to compare against. A git branch/tag/hash when old_type is git.
      # The base commit is injected from CI via `kibot -E KIBOT_DIFF_OLD=...`
      # (@VAR@ is KiBot's preprocessor replacement), so this file never
      # hardcodes a branch name or assumes one.
      old: '@KIBOT_DIFF_OLD_PCB@'
      # Explicit filename: the default (%i-based) name is identical for the
      # commit and tag pairs, which would collide when flattened into the
      # release assets. Change commit first, its parent second, e.g.
      # diff_commit-46e281e-cd41e62-pcb-F_Cu.pdf (H = latest commit touching
      # the file, H^ = the actual diff base). The layer suffix keeps the
      # seven parts distinct; CI merges them into diff_commit-...-pcb.pdf.
      # Self-explanatory after download.
      output: 'diff_commit-@KIBOT_DIFF_CHG_PCB_SHORT@-@KIBOT_DIFF_OLD_PCB_SHORT@-pcb-F_Cu.%x'
      # [git,file,output,multivar='git'] How to interpret the `old` name.
      old_type: 'git'
      # [string|list(string)=''] File to compare, blank means the current PCB/SCH.
      # 'HEAD' = the checked-out commit, equivalent to current in a clean CI tree.
      new: 'HEAD'
      # [git,file,output,multivar,current='current'] How to interpret the `new` name.
      new_type: 'git'
      # [red_green,stats,2color='red_green'] Added stuff green, removed red.
      diff_mode: 'red_green'
      # [number=72..600] Resolution (Dots Per Inch) for the diff images.
      # 300 for legible review images; no persistent cache is used
      # (cache_dir unset -> fresh temp dir each run), so no flush needed.
      dpi: 300
      # [boolean=false] Only include layers/pages with differences in the output PDF.
      only_different: true
    layers:
      - 'F.Cu'

  - name: 'diff_pcb_in1'
    comment: "visual PCB diff vs previous commit, In1.Cu layer (PDF part, see page-order note)"
    type: diff
    dir: diff/commit
    options:
      old: '@KIBOT_DIFF_OLD_PCB@'
      output: 'diff_commit-@KIBOT_DIFF_CHG_PCB_SHORT@-@KIBOT_DIFF_OLD_PCB_SHORT@-pcb-In1_Cu.%x'
      old_type: 'git'
      new: 'HEAD'
      new_type: 'git'
      diff_mode: 'red_green'
      dpi: 300
      only_different: true
    layers:
      - 'In1.Cu'

  - name: 'diff_pcb_in2'
    comment: "visual PCB diff vs previous commit, In2.Cu layer (PDF part, see page-order note)"
    type: diff
    dir: diff/commit
    options:
      old: '@KIBOT_DIFF_OLD_PCB@'
